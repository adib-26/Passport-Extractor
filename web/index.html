<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passport extractor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="mast">
    <p class="kicker">Malaysian passport</p>
    <div class="mast-row">
      <h1>Passport extractor</h1>
      <div class="actions">
        <label class="upload" for="file">
          Upload passport
          <input id="file" name="file" type="file" accept="application/pdf,image/*">
        </label>
        <button type="button" id="run">Run again</button>
      </div>
    </div>
    <p class="lede">Read the holder page, or the entry and visa stamps.</p>
  </header>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <main id="results"></main>
  <dialog id="seal-editor" aria-labelledby="seal-title">
    <form id="seal-form" method="post" action="/api/layer4">
      <p id="seal-title">Edit stamp text</p>
      <label for="seal-country">Country</label>
      <input id="seal-country" name="country" autocomplete="off" maxlength="200">
      <label for="seal-text">Stamp text</label>
      <textarea id="seal-text" name="text" rows="8" maxlength="4000"></textarea>
      <div class="dialog-actions">
        <button type="submit">Save</button>
        <button type="button" id="seal-cancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="stamp-view" aria-labelledby="stamp-title">
    <p id="stamp-title">Stamp</p>
    <img id="stamp-photo" alt="Stamp the date was read from">
    <div class="dialog-actions">
      <button type="button" id="stamp-close">Close</button>
    </div>
  </dialog>
  <dialog id="page-view" aria-labelledby="page-title">
    <p id="page-title">Page</p>
    <div id="page-frame">
      <img id="page-photo" alt="Passport page the stamp was read from">
      <div id="page-box" hidden></div>
    </div>
    <div class="dialog-actions">
      <button type="button" id="page-close">Close</button>
    </div>
  </dialog>
  <dialog id="date-editor" aria-labelledby="date-title">
    <form id="date-form" method="post" action="/api/layer5">
      <p id="date-title">Edit date</p>
      <label for="date-country">Country</label>
      <input id="date-country" name="country" autocomplete="off" maxlength="200">
      <label for="date-value">Date</label>
      <input id="date-value" name="date" type="date" min="1940-01-01" max="2029-12-31" autocomplete="off">
      <label for="date-type">Type</label>
      <select id="date-type" name="type">
        <option value="arrival">Arrival</option>
        <option value="departure">Departure</option>
        <option value="visa duration">Visa duration</option>
        <option value="unknown">Unknown</option>
      </select>
      <div class="dialog-actions">
        <button type="submit">Save</button>
        <button type="button" id="date-cancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="stay-editor" aria-labelledby="stay-title">
    <form id="stay-form" method="post" action="/api/layer6">
      <p id="stay-title">Edit stay</p>
      <label for="departure-country">Departure country</label>
      <input id="departure-country" name="departure_country" autocomplete="off" maxlength="200">
      <label for="arrival-country">Arrival country</label>
      <input id="arrival-country" name="arrival_country" autocomplete="off" maxlength="200">
      <div class="dialog-actions">
        <button type="submit">Save</button>
        <button type="button" id="stay-cancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
